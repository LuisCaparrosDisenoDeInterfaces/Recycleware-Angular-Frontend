<div class="container">

    <h1 class="h1 fw-bold p-3">Añadir producto</h1>
    <div class="bg-secondary-subtle p-3 border rounded shadow-sm">
        <form>
            <div class="mb-3">
                <label for="inputProdNombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="inputNombreProd">
            </div>
            <div class="mb-3 container-fluid p-0">
                <div class="row">
                    <div class="col">
                        <label for="inputCategoriaProd" class="form-label">Categoria</label>
                        <select class="form-select" id="inputCategoriaProd">
                            <option value="Periféricos" selected>Periféricos</option>
                            <option value="Portátiles">Portátiles</option>
                            <option value="Sobremesa">Sobremesa</option>
                            <option value="Componentes">Componentes</option>
                            <option value="Monitores">Monitores</option>
                        </select>
                    </div>
                    <div class="col">
                        <label for="inputEstadoProd" class="form-label">Estado</label>
                        <select class="form-select" id="inputEstadoProd">
                            <option value="Excelente" selected>Excelente</option>
                            <option value="Funcional">Funcional</option>
                            <option value="Dañado">Dañado</option>
                            <option value="Para Piezas">Para Piezas</option>
                        </select>
                    </div>
                    <div class="col">
                        <label for="inputDisponibilidadProd" class="form-label">Disponibilidad</label>
                        <select class="form-select" id="inputDisponibilidadProd">
                            <option value="Disponible" selected>Disponible</option>
                            <option value="Reservado">Reservado</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="inputDescripcionProd" class="form-label">Descripción</label>
                    <textarea class="form-control" id="inputDescripcionProd" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label for="inputImagenProd" class="form-label">URL de la imagen</label>
                    <input type="text" class="form-control" id="inputImagenProd">
                </div>

            </div>
            <button type="submit" class="btn btn-primary">Guardar</button>
        </form>
    </div>

</div>
